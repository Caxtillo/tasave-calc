name: Scrape rates (BCV + Binance)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run scraper
        run: python scraper.py
      - name: Commit rates
        run: |
          git config user.name "TasaVes Bot"
          git config user.email "bot@tasaves.com"
          git add rates.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update rates $(date +%Y-%m-%d %H:%M)"
          git push
