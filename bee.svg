<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0f0c1d"/>
  <!-- Body -->
  <ellipse cx="256" cy="290" rx="110" ry="120" fill="url(#bg)"/>
  <!-- Stripes -->
  <rect x="146" y="240" width="220" height="18" rx="9" fill="#1c1917" opacity="0.85"/>
  <rect x="146" y="280" width="220" height="18" rx="9" fill="#1c1917" opacity="0.85"/>
  <rect x="155" y="320" width="202" height="18" rx="9" fill="#1c1917" opacity="0.85"/>
  <!-- Wings -->
  <ellipse cx="210" cy="220" rx="50" ry="35" fill="#bfdbfe" opacity="0.6" transform="rotate(-15,210,220)"/>
  <ellipse cx="310" cy="220" rx="50" ry="35" fill="#bfdbfe" opacity="0.6" transform="rotate(15,310,220)"/>
  <!-- Eyes -->
  <circle cx="215" cy="275" r="12" fill="#0f0c1d"/>
  <circle cx="297" cy="275" r="12" fill="#0f0c1d"/>
  <!-- Eye shine -->
  <circle cx="218" cy="272" r="4" fill="white" opacity="0.8"/>
  <circle cx="300" cy="272" r="4" fill="white" opacity="0.8"/>
  <!-- Smile -->
  <path d="M220 305 Q256 335 292 305" stroke="#0f0c1d" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="185" cy="295" r="10" fill="#fca5a5" opacity="0.4"/>
  <circle cx="327" cy="295" r="10" fill="#fca5a5" opacity="0.4"/>
</svg>
