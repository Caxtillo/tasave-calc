<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TasaVes - Tasas de Cambio Venezuela</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ico.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1d;
            color: #f3f0ff;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .purple-glow {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        .input-focus:focus {
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.1);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .main-container {
            height: auto;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        @media (min-width: 640px) {
            .main-container {
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-[#0f0c1d] to-[#0f0c1d]">

    <div id="app" class="w-full max-w-md main-container p-4 sm:p-6">
        <!-- Loading State -->
        <div id="loading" class="fixed inset-0 z-50 bg-[#0f0c1d] flex flex-col items-center justify-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="text-purple-300 animate-pulse font-medium">Consultando tasas actualizadas...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden flex-1 flex flex-col items-center justify-center space-y-4">
            <div class="glass rounded-3xl p-6 text-center space-y-4 w-full">
                <i data-lucide="alert-circle" class="mx-auto h-10 w-10 text-red-400"></i>
                <h2 class="text-xl font-semibold text-purple-100">Error de conexión</h2>
                <button onclick="location.reload()" class="w-full py-3 bg-purple-500/20 hover:bg-purple-500/40 text-purple-200 rounded-xl transition-all border border-purple-500/30">Reintentar</button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="content" class="hidden contents">
            <!-- Header -->
            <header class="relative pt-2 pb-1 shrink-0">
                <div class="flex items-center justify-between mb-1">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
                        Tasa<span class="purple-glow text-purple-400">Ves</span>
                    </h1>
                    <button onclick="manualRefresh()" id="refresh-btn" class="p-2 bg-purple-500/10 hover:bg-purple-500/20 rounded-xl transition-all group border border-purple-500/20">
                        <i data-lucide="refresh-cw" class="w-5 h-5 text-purple-400 group-active:rotate-180 transition-transform duration-500"></i>
                    </button>
                </div>
                
                <div id="update-info" class="flex flex-col items-start space-y-0.5 border-l-2 border-purple-500/30 pl-3 py-1">
                    <p id="last-date" class="text-[10px] text-purple-300/60 uppercase tracking-[0.2em] font-bold">
                        Cargando fecha...
                    </p>
                    <p id="last-time" class="text-[14px] text-purple-300 uppercase tracking-widest font-black flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-500 animate-pulse"></span>
                        --:-- --
                    </p>
                </div>
                
                <button id="install-btn" class="hidden absolute left-1/2 -top-2 -translate-x-1/2 px-4 py-1 bg-purple-500 text-purple-950 text-[10px] font-black rounded-full shadow-lg shadow-purple-500/20">
                    INSTALAR APP
                </button>
            </header>

            <!-- Rates Grid -->
            <div class="rates-grid grid grid-cols-2 gap-2 sm:gap-3 shrink-0">
                <div class="glass rounded-2xl p-2.5 sm:p-3 flex flex-col items-center justify-center">
                    <span class="text-[8px] uppercase tracking-widest text-purple-300/50 font-bold mb-0.5">BCV Oficial</span>
                    <span class="text-lg sm:text-xl font-bold text-white leading-tight" id="rate-bcv">--.--</span>
                    <span class="text-[7px] text-purple-400/60 font-medium uppercase">Bs. por USD</span>
                </div>
                <div class="glass rounded-2xl p-2.5 sm:p-3 flex flex-col items-center justify-center">
                    <span class="text-[8px] uppercase tracking-widest text-purple-300/50 font-bold mb-0.5">Binance P2P</span>
                    <span class="text-lg sm:text-xl font-bold text-white leading-tight" id="rate-binance">--.--</span>
                    <span class="text-[7px] text-purple-400/60 font-medium uppercase">Bs. por USDT</span>
                </div>
            </div>

            <!-- Calculator Card -->
            <div class="main-card glass rounded-3xl p-4 sm:p-5 flex flex-col gap-3 sm:gap-4 shadow-[0_20px_50px_rgba(0,0,0,0.3)]">
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="btn-bcv" onclick="setSource('bcv')" class="flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all bg-purple-400 text-purple-950">
                        BCV
                    </button>
                    <button id="btn-binance" onclick="setSource('binance')" class="flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all text-purple-300">
                        BINANCE
                    </button>
                    <button id="btn-custom" onclick="setSource('custom')" class="flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all text-purple-300">
                        PROPIA
                    </button>
                </div>

                <div class="flex flex-col space-y-3">
                    <div class="relative w-full">
                        <label class="text-[8px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 mb-1 block font-bold">Dólares (USD)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-purple-400 font-bold text-base">$</span>
                            <input type="number" id="input-usd" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-xl py-3 pl-10 pr-4 text-xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/30">
                        </div>
                    </div>

                    <div class="flex justify-center -my-3 relative z-10">
                        <div class="bg-purple-950/80 p-1 rounded-full border border-purple-500/30 backdrop-blur-sm">
                            <i data-lucide="arrow-down-up" class="w-3 h-3 text-purple-300"></i>
                        </div>
                    </div>

                    <div class="relative w-full">
                        <label class="text-[8px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 mb-1 block font-bold">Bolívares (VES)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-purple-400 font-bold text-xs">Bs</span>
                            <input type="number" id="input-ves" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-xl py-3 pl-12 pr-4 text-xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/30">
                        </div>
                    </div>
                </div>

                <!-- Custom Rate Input (Conditional) -->
                <div id="custom-rate-container" class="hidden pt-2 border-t border-purple-500/10">
                    <label class="text-[8px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 mb-1 block font-bold">Tu Tasa Personalizada</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-purple-400 font-bold text-[10px]">Bs/$</span>
                        <input type="number" id="input-custom-rate" placeholder="Introduce tu tasa" step="0.01"
                            class="w-full bg-purple-500/5 border border-purple-500/20 rounded-xl py-2 pl-14 pr-4 text-sm font-bold text-purple-100 focus:outline-none input-focus transition-all">
                    </div>
                </div>

                <div class="pt-1 border-t border-purple-500/10">
                    <p class="text-[7px] text-center text-purple-400/40 font-bold uppercase tracking-[0.2em]">
                        Calculando con <span id="current-label" class="text-purple-300">Tasa BCV</span>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center py-1 shrink-0">
                <p class="text-[7px] uppercase tracking-[0.4em] opacity-20 font-bold">TasaVes &bull; 2026</p>
            </footer>
        </div>
    </div>

    <script>
        let rates = { bcv: 0, binance: 0, custom: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';
        let deferredPrompt;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateBinanceEl = document.getElementById('rate-binance');
        const lastUpdateEl = document.getElementById('last-update');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const inputCustomRate = document.getElementById('input-custom-rate');
        const customRateContainer = document.getElementById('custom-rate-container');
        
        const btnBcv = document.getElementById('btn-bcv');
        const btnBinance = document.getElementById('btn-binance');
        const btnCustom = document.getElementById('btn-custom');
        
        const currentLabel = document.getElementById('current-label');
        const installBtn = document.getElementById('install-btn');
        const refreshBtnIcon = document.querySelector('#refresh-btn i');

        lucide.createIcons();

        // Manual Refresh with animation
        async function manualRefresh() {
            if (refreshBtnIcon) refreshBtnIcon.classList.add('animate-spin');
            lastUpdateEl.textContent = 'Actualizando...';
            await fetchRates();
            setTimeout(() => {
                if (refreshBtnIcon) refreshBtnIcon.classList.remove('animate-spin');
            }, 500);
        }

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        async function fetchRates() {
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                const bcvData = data.find(item => item.fuente === 'oficial');
                const paraleloData = data.find(item => item.fuente === 'paralelo');

                if (bcvData) rates.bcv = bcvData.promedio || bcvData.venta;
                if (paraleloData) rates.binance = paraleloData.promedio || paraleloData.venta;

                updateUI(bcvData?.fechaActualizacion || paraleloData?.fechaActualizacion);
            } catch (error) {
                console.error('Fetch error:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        function updateUI(dateString) {
            rateBcvEl.textContent = rates.bcv.toFixed(2);
            rateBinanceEl.textContent = rates.binance.toFixed(2);
            
            if (dateString) {
                const date = new Date(dateString);
                lastUpdateEl.innerHTML = `<i data-lucide="check-circle-2" class="w-2.5 h-2.5"></i> ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                lucide.createIcons();
            }

            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
        }

        function setSource(source) {
            currentSource = source;
            
            // Reset buttons
            [btnBcv, btnBinance, btnCustom].forEach(btn => {
                btn.className = 'flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all text-purple-300';
            });

            customRateContainer.classList.add('hidden');

            if (source === 'bcv') {
                btnBcv.className = 'flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all bg-purple-400 text-purple-950';
                currentLabel.textContent = 'Tasa BCV';
            } else if (source === 'binance') {
                btnBinance.className = 'flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all bg-purple-400 text-purple-950';
                currentLabel.textContent = 'Binance P2P';
            } else if (source === 'custom') {
                btnCustom.className = 'flex-1 py-1.5 text-[9px] font-black rounded-lg transition-all bg-purple-400 text-purple-950';
                currentLabel.textContent = 'Tasa Propia';
                customRateContainer.classList.remove('hidden');
            }
            
            calculate(lastEdited);
        }

        function calculate(triggerField) {
            let rate = currentSource === 'custom' ? parseFloat(inputCustomRate.value) : rates[currentSource];
            
            if (!rate || isNaN(rate) || rate === 0) {
                if (triggerField === 'usd') inputVes.value = '';
                else inputUsd.value = '';
                return;
            }

            if (triggerField === 'usd') {
                const val = parseFloat(inputUsd.value);
                inputVes.value = !isNaN(val) ? (val * rate).toFixed(2) : '';
            } else {
                const val = parseFloat(inputVes.value);
                inputUsd.value = !isNaN(val) ? (val / rate).toFixed(2) : '';
            }
        }

        inputUsd.addEventListener('input', () => { lastEdited = 'usd'; calculate('usd'); });
        inputVes.addEventListener('input', () => { lastEdited = 'ves'; calculate('ves'); });
        inputCustomRate.addEventListener('input', () => { calculate(lastEdited); });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }

        fetchRates();
    </script>
</body>
</html>
