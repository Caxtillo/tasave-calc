<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TasaVes - Tasas de Cambio Venezuela</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ico.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1d;
            color: #f3f0ff;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .glass {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .purple-glow {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        .main-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem;
        }
        .keypad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(30, 20, 50, 0.5);
            border: 1px solid rgba(167, 139, 250, 0.15);
            color: #f3f0ff;
            transition: all 100ms;
            user-select: none;
            -webkit-user-select: none;
            min-height: 0;
        }
        .keypad-btn:active {
            background: rgba(167, 139, 250, 0.25);
            transform: scale(0.96);
        }
        .keypad-btn-op {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.3);
            color: #a78bfa;
        }
        .input-highlight {
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-[#0f0c1d] to-[#0f0c1d]">

    <div id="app" class="w-full max-w-md mx-auto main-container">
        <div id="loading" class="fixed inset-0 z-50 bg-[#0f0c1d] flex flex-col items-center justify-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="text-purple-300 animate-pulse font-medium">Consultando tasas actualizadas...</p>
        </div>

        <div id="error" class="hidden fixed inset-0 z-50 bg-[#0f0c1d] flex flex-col items-center justify-center space-y-4">
            <div class="glass rounded-3xl p-6 text-center space-y-4 w-11/12 max-w-sm">
                <i data-lucide="alert-circle" class="mx-auto h-10 w-10 text-red-400"></i>
                <h2 class="text-xl font-semibold text-purple-100">Error de conexión</h2>
                <button onclick="location.reload()" class="w-full py-3 bg-purple-500/20 hover:bg-purple-500/40 text-purple-200 rounded-xl transition-all border border-purple-500/30">Reintentar</button>
            </div>
        </div>

        <div id="content" class="hidden flex flex-col h-full">
            <header class="shrink-0">
                <div class="flex items-center justify-between mb-0.5">
                    <h1 class="text-2xl font-extrabold">
                        Tasa<span class="purple-glow text-purple-400">Ves</span>
                    </h1>
                    <button onclick="manualRefresh()" id="refresh-btn" class="p-1.5 bg-purple-500/10 hover:bg-purple-500/20 rounded-xl transition-all border border-purple-500/20">
                        <i data-lucide="refresh-cw" class="w-4 h-4 text-purple-400"></i>
                    </button>
                </div>
                <div id="update-info" class="flex items-center gap-2 border-l-2 border-purple-500/30 pl-2 py-0.5 mb-1">
                    <p id="last-date" class="text-[9px] text-purple-300/60 uppercase tracking-[0.2em] font-bold">Cargando...</p>
                    <span class="text-purple-500/40">|</span>
                    <p id="last-time" class="text-[11px] text-purple-300 uppercase tracking-widest font-black flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-500 animate-pulse"></span>
                        --:--
                    </p>
                </div>
                <button id="install-btn" class="hidden absolute left-1/2 top-1 -translate-x-1/2 px-4 py-0.5 bg-purple-500 text-purple-950 text-[9px] font-black rounded-full shadow-lg shadow-purple-500/20">
                    INSTALAR APP
                </button>
            </header>

            <div class="flex-1 flex flex-col gap-2 min-h-0 py-1">
                <div class="grid grid-cols-3 gap-1.5 shrink-0">
                <div class="glass rounded-2xl p-2 flex flex-col items-center justify-center">
                    <span class="text-[7px] uppercase tracking-widest text-purple-300/50 font-bold">BCV Oficial</span>
                    <span class="text-base font-bold text-white leading-tight" id="rate-bcv">--.--</span>
                    <span class="text-[6px] text-purple-400/60 font-medium">Bs/USD</span>
                </div>
                <div class="glass rounded-2xl p-2 flex flex-col items-center justify-center">
                    <span class="text-[7px] uppercase tracking-widest text-purple-300/50 font-bold">Binance P2P</span>
                    <span class="text-base font-bold text-white leading-tight" id="rate-binance">--.--</span>
                    <span class="text-[6px] text-purple-400/60 font-medium">Bs/USDT</span>
                </div>
                <div class="glass rounded-2xl p-2 flex flex-col items-center justify-center">
                    <span class="text-[7px] uppercase tracking-widest text-purple-300/50 font-bold">Tasa Propia</span>
                    <span class="text-base font-bold text-white leading-tight" id="rate-propia">--.--</span>
                    <span class="text-[6px] text-purple-400/60 font-medium">Bs/USD</span>
                </div>
            </div>

            <div class="glass rounded-3xl p-3 flex flex-col gap-2 shrink-0">
                <div class="flex bg-black/40 p-0.5 rounded-xl">
                    <button id="btn-bcv" onclick="setSource('bcv')" class="flex-1 py-1 text-[8px] font-black rounded-lg bg-purple-400 text-purple-950">BCV</button>
                    <button id="btn-binance" onclick="setSource('binance')" class="flex-1 py-1 text-[8px] font-black rounded-lg text-purple-300">BINANCE</button>
                    <button id="btn-custom" onclick="setSource('custom')" class="flex-1 py-1 text-[8px] font-black rounded-lg text-purple-300">PROPIA</button>
                </div>

                <div class="space-y-2">
                    <div>
                        <label class="text-[7px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 font-bold">Dólares (USD)</label>
                        <input type="text" id="input-usd" readonly
                            class="w-full bg-black/40 border border-purple-500/10 rounded-xl py-2.5 px-3 text-lg font-bold text-white outline-none transition-all placeholder:text-purple-900/30 cursor-default">
                    </div>
                    <div class="flex justify-center -my-2 relative z-10">
                        <div class="bg-purple-950/80 p-0.5 rounded-full border border-purple-500/30 backdrop-blur-sm">
                            <i data-lucide="arrow-down-up" class="w-2.5 h-2.5 text-purple-300"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-[7px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 font-bold">Bolívares (VES)</label>
                        <input type="text" id="input-ves" readonly
                            class="w-full bg-black/40 border border-purple-500/10 rounded-xl py-2.5 px-3 text-lg font-bold text-white outline-none transition-all placeholder:text-purple-900/30 cursor-default">
                    </div>
                </div>

                <div id="custom-rate-container" class="hidden pt-1 border-t border-purple-500/10">
                    <label class="text-[7px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 font-bold">Tu Tasa</label>
                    <input type="text" id="input-custom-rate" readonly
                        class="w-full bg-purple-500/5 border border-purple-500/20 rounded-xl py-1.5 px-3 text-sm font-bold text-purple-100 outline-none transition-all cursor-default">
                </div>
            </div>
            </div>

            <div id="keypad" class="shrink-0 grid grid-cols-4 gap-1.5 pb-0.5" style="height:38dvh;grid-template-rows:1fr 1fr 1fr 1fr;">
                <button class="keypad-btn" data-key="7">7</button>
                <button class="keypad-btn" data-key="8">8</button>
                <button class="keypad-btn" data-key="9">9</button>
                <button class="keypad-btn keypad-btn-op" data-key="backspace"><i data-lucide="delete" class="w-5 h-5"></i></button>

                <button class="keypad-btn" data-key="4">4</button>
                <button class="keypad-btn" data-key="5">5</button>
                <button class="keypad-btn" data-key="6">6</button>
                <button class="keypad-btn keypad-btn-op" data-key="+">+</button>

                <button class="keypad-btn" data-key="1">1</button>
                <button class="keypad-btn" data-key="2">2</button>
                <button class="keypad-btn" data-key="3">3</button>
                <button class="keypad-btn keypad-btn-op" data-key="clear">C</button>

                <button class="keypad-btn" data-key="0">0</button>
                <button class="keypad-btn" data-key=".">.</button>
                <button class="keypad-btn keypad-btn-op" data-key="clear-all">AC</button>
                <button class="keypad-btn keypad-btn-op" data-key="swap">⇄</button>
            </div>
        </div>
    </div>

    <script>
        let rates = { bcv: 0, binance: 0, custom: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';
        let activeInput = 'usd';
        let deferredPrompt;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateBinanceEl = document.getElementById('rate-binance');
        const lastDateEl = document.getElementById('last-date');
        const lastTimeEl = document.getElementById('last-time');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const inputCustomRate = document.getElementById('input-custom-rate');
        const customRateContainer = document.getElementById('custom-rate-container');
        const ratePropiaEl = document.getElementById('rate-propia');

        const btnBcv = document.getElementById('btn-bcv');
        const btnBinance = document.getElementById('btn-binance');
        const btnCustom = document.getElementById('btn-custom');

        const installBtn = document.getElementById('install-btn');

        const inputs = [inputUsd, inputVes, inputCustomRate];

        lucide.createIcons();

        function focusInput(name) {
            activeInput = name;
            inputs.forEach(el => el.classList.remove('input-highlight'));
            if (name === 'usd') inputUsd.classList.add('input-highlight');
            else if (name === 'ves') inputVes.classList.add('input-highlight');
            else inputCustomRate.classList.add('input-highlight');
        }

        inputUsd.addEventListener('focus', () => { lastEdited = 'usd'; focusInput('usd'); });
        inputVes.addEventListener('focus', () => { lastEdited = 'ves'; focusInput('ves'); });
        inputCustomRate.addEventListener('focus', () => { focusInput('custom'); calculate(lastEdited); });

        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.key;
                const el = activeInput === 'custom' ? inputCustomRate
                          : activeInput === 'ves' ? inputVes : inputUsd;

                if (key === 'backspace') {
                    el.value = el.value.slice(0, -1);
                } else if (key === 'clear') {
                    el.value = '';
                } else if (key === 'clear-all') {
                    el.value = '';
                    if (activeInput === 'custom') calculate(lastEdited);
                    else triggerCalc();
                } else if (key === 'swap') {
                    if (activeInput === 'usd') { focusInput('ves'); lastEdited = 'ves'; triggerCalc(); }
                    else if (activeInput === 'ves') { focusInput('usd'); lastEdited = 'usd'; triggerCalc(); }
                } else {
                    el.value += key;
                }

                if (activeInput === 'custom') calculate(lastEdited);
                else triggerCalc();
            });
        });

        function triggerCalc() {
            calculate(lastEdited);
            if (lastEdited === 'usd') focusInput('usd');
            else focusInput('ves');
        }

        async function manualRefresh() {
            lastDateEl.textContent = 'Actualizando...';
            lastTimeEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-purple-500 animate-pulse"></span> --:--';
            await fetchRates();
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        async function fetchRates() {
            try {
                const response = await fetch('/rates.json');
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                if (data.USD) rates.bcv = data.USD;
                updateUI(data);
            } catch (error) {
                console.error('Fetch error:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }

            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (res.ok) {
                    const list = await res.json();
                    const p2p = list.find(item => item.fuente === 'paralelo');
                    if (p2p) rates.binance = p2p.promedio || p2p.venta;
                }
            } catch (_) {}

            updateUI(null);
        }

        function updateUI(data) {
            rateBcvEl.textContent = rates.bcv > 0 ? rates.bcv.toFixed(2) : '--.--';
            rateBinanceEl.textContent = rates.binance > 0 ? rates.binance.toFixed(2) : '--.--';
            ratePropiaEl.textContent = rates.custom > 0 ? rates.custom.toFixed(2) : '--.--';
            if (data && data.effective_date) {
                lastDateEl.textContent = 'Tasa vigente';
                lastTimeEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> ${data.effective_date}`;
            }
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
            focusInput('usd');
        }

        function setSource(source) {
            currentSource = source;
            [btnBcv, btnBinance, btnCustom].forEach(btn => {
                btn.className = 'flex-1 py-1 text-[8px] font-black rounded-lg transition-all text-purple-300';
            });
            customRateContainer.classList.add('hidden');
            if (source === 'bcv') {
                btnBcv.className = 'flex-1 py-1 text-[8px] font-black rounded-lg bg-purple-400 text-purple-950';
            } else if (source === 'binance') {
                btnBinance.className = 'flex-1 py-1 text-[8px] font-black rounded-lg bg-purple-400 text-purple-950';
            } else if (source === 'custom') {
                btnCustom.className = 'flex-1 py-1 text-[8px] font-black rounded-lg bg-purple-400 text-purple-950';
                customRateContainer.classList.remove('hidden');
                focusInput('custom');
            }
            if (source === 'custom') focusInput('custom');
            else focusInput(lastEdited);
            calculate(source === 'custom' ? 'custom' : lastEdited);
        }

        function parseSum(str) {
            if (!str || str.trim() === '') return NaN;
            const parts = str.split('+');
            let total = 0;
            for (const p of parts) {
                const val = parseFloat(p.trim());
                if (isNaN(val)) return NaN;
                total += val;
            }
            return total;
        }

        function calculate(triggerField) {
            let rate = currentSource === 'custom' ? parseFloat(inputCustomRate.value) : rates[currentSource];
            rates.custom = parseFloat(inputCustomRate.value) || 0;
            ratePropiaEl.textContent = rates.custom > 0 ? rates.custom.toFixed(2) : '--.--';
            if (!rate || isNaN(rate) || rate === 0) {
                if (triggerField === 'usd' || triggerField === 'custom') inputVes.value = '';
                else inputUsd.value = '';
                return;
            }
            if (triggerField === 'usd' || triggerField === 'custom') {
                const val = parseSum(inputUsd.value);
                inputVes.value = !isNaN(val) ? (val * rate).toFixed(2) : '';
            } else {
                const val = parseSum(inputVes.value);
                inputUsd.value = !isNaN(val) ? (val / rate).toFixed(2) : '';
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        fetchRates();
    </script>
</body>
</html>
