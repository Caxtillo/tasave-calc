<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TasaVes - Tasas de Cambio Venezuela</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ico.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rate-py: 0.250rem;
            --rate-px: 0.250rem;
            --rate-label: 16px;
            --rate-value: 1.563rem;
            --input-py: 1.188rem;
            --input-px: 1.063rem;
            --input-fs: 2.250rem;
            --label-fs: 13px;
            --input-gap: 0.813rem;
            --title-fs: 1.563rem;
            --header-mb: 0.938rem;
            --keypad-h: 38dvh;
            --top-py: 1.125rem;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1d;
            color: #f3f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .glass {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .input-box {
            background: rgba(20, 12, 40, 0.8);
            border: 2px solid rgba(167, 139, 250, 0.25);
            border-radius: 0.85rem;
            padding: var(--input-py) var(--input-px);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: border 150ms;
        }
        .input-currency {
            font-size: calc(var(--input-fs) * 0.6);
            font-weight: 700;
            color: rgba(167, 139, 250, 0.5);
            flex-shrink: 0;
            line-height: 1;
        }
        .input-inner {
            background: transparent;
            border: none;
            outline: none;
            font-size: var(--input-fs);
            font-weight: 800;
            color: white;
            width: 100%;
            min-width: 0;
            cursor: text;
            text-align: right;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            caret-color: rgba(167, 139, 250, 0.8);
        }
        .input-inner::-webkit-scrollbar { display: none; }
        .input-box.input-selected {
            border-color: #a78bfa !important;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.35) !important;
            background: rgba(167, 139, 250, 0.08) !important;
        }
        .input-box:focus-within {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
        }
        .keypad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1.35rem;
            background: rgba(30, 20, 50, 0.5);
            border: 1px solid rgba(167, 139, 250, 0.15);
            color: #f3f0ff;
            transition: all 100ms;
            user-select: none;
            -webkit-user-select: none;
            min-height: 0;
        }
        .keypad-btn:active {
            background: rgba(167, 139, 250, 0.25);
            transform: scale(0.94);
        }
        .keypad-btn-op {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.3);
            color: #a78bfa;
        }
        .rate-card {
            border-radius: 0.85rem;
            padding: var(--rate-py) var(--rate-px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            background: rgba(30, 20, 50, 0.5);
            border: 2px solid transparent;
            transition: all 200ms;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .rate-card:active {
            transform: scale(0.97);
        }
        .rate-card-selected {
            border-color: rgba(167, 139, 250, 0.5);
            background: rgba(167, 139, 250, 0.1);
        }
        .rate-label { font-size: var(--rate-label); font-weight: 700; color: rgba(167, 139, 250, 0.7); }
        .rate-value { font-size: var(--rate-value); font-weight: 900; color: white; }
        .input-label { font-size: var(--label-fs); }

        /* Panel tool - solo en desktop */
        @media (min-width: 1024px) {
            #layout-btn {
                position: fixed; top: 50%; right: 0; transform: translateY(-50%);
                z-index: 9999; width: 36px; height: 36px;
                display: flex; align-items: center; justify-content: center;
                background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3);
                border-radius: 8px 0 0 8px; color: #a78bfa;
                font-size: 1.1rem; cursor: pointer; transition: all 150ms;
                border-right: none;
            }
            #layout-btn:hover { background: rgba(167,139,250,0.25); }
            #layout-btn.active { right: 280px; }

            #layout-panel {
                position: fixed; top: 0; right: -300px; width: 280px; height: 100vh;
                z-index: 9998; background: rgba(15,12,29,0.97);
                border-left: 1px solid rgba(167,139,250,0.15);
                padding: 1rem; overflow-y: auto; transition: right 200ms;
                font-family: 'Inter', sans-serif;
            }
            #layout-panel.open { right: 0; }

            #layout-panel::-webkit-scrollbar { width: 4px; }
            #layout-panel::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 2px; }

            .lp-hdr { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(167,139,250,0.5); margin: 10px 0 4px; }
            .lp-group { background: rgba(30,20,50,0.4); border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; border: 1px solid rgba(167,139,250,0.08); }
            .lp-group label { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 600; color: rgba(243,240,255,0.5); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
            .lp-group label span { color: #a78bfa; font-family: monospace; font-size: 10px; }
            .lp-group input[type="range"] { width: 100%; accent-color: #a78bfa; height: 3px; cursor: pointer; }
            .lp-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #a78bfa; cursor: pointer; }

            .lp-copy {
                display: block; width: 100%; margin-top: 8px; padding: 6px;
                background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3);
                border-radius: 6px; color: #a78bfa; font-size: 10px; font-weight: 600;
                text-align: center; cursor: pointer; transition: all 100ms;
            }
            .lp-copy:active { background: rgba(167,139,250,0.3); }
            .lp-output { font-family: monospace; font-size: 10px; background: rgba(0,0,0,0.4); border-radius: 4px; padding: 8px; white-space: pre-wrap; color: #a78bfa; border: 1px solid rgba(167,139,250,0.1); margin-top: 4px; max-height: 200px; overflow-y: auto; }
        }
        @media (max-width: 1023px) {
            #layout-btn, #layout-panel { display: none !important; }
        }
        .nav-item { transition: all 150ms; }
        .nav-active { background: rgba(167,139,250,0.12); color: #a78bfa !important; }
        #page-compra input, #page-compra select { caret-color: rgba(167,139,250,0.8); cursor: text; }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-[#0f0c1d] to-[#0f0c1d]">

    <div id="app" class="w-full max-w-md mx-auto flex flex-col px-3" style="position:fixed;top:0;left:0;right:0;height:100%;overflow:hidden">
        <div id="loading" class="fixed inset-0 z-50 bg-[#0f0c1d] flex flex-col items-center justify-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="text-purple-300 animate-pulse font-medium">Consultando tasas...</p>
        </div>

        <div id="error" class="hidden fixed inset-0 z-50 bg-[#0f0c1d] flex flex-col items-center justify-center gap-4">
            <div class="glass rounded-3xl p-6 text-center w-11/12 max-w-sm">
                <i data-lucide="alert-circle" class="mx-auto h-10 w-10 text-red-400 mb-3"></i>
                <h2 class="text-xl font-semibold text-purple-100">Error de conexión</h2>
                <button onclick="location.reload()" class="w-full mt-4 py-3 bg-purple-500/20 text-purple-200 rounded-xl border border-purple-500/30">Reintentar</button>
            </div>
        </div>

        <div id="content" class="hidden flex flex-col h-full">

            <header class="flex items-center justify-between shrink-0" style="padding-top:var(--top-py);margin-bottom:var(--header-mb)">
                <div class="flex items-center gap-2">
                    <h1 class="font-extrabold" style="font-size:var(--title-fs)">Tasa<span class="text-purple-400">Ves</span></h1>
                    <span class="text-[9px] text-purple-400/50 font-bold uppercase tracking-widest" id="last-date">Cargando...</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-purple-300/70 font-bold flex items-center gap-1" id="last-time">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-500 animate-pulse"></span> --:--
                    </span>
                    <button onclick="manualRefresh()" id="refresh-btn" class="p-1.5 bg-purple-500/10 rounded-xl border border-purple-500/20">
                        <i data-lucide="refresh-cw" class="w-4 h-4 text-purple-400"></i>
                    </button>
                </div>
            </header>

            <div id="page-inicio" class="flex-1 flex flex-col min-h-0" style="padding-bottom:var(--top-py)">
                <div class="flex gap-1.5 shrink-0 mt-2">
                    <div onclick="setSource('bcv')" id="card-bcv" class="rate-card flex-1 rate-card-selected">
                        <span class="rate-label">BCV</span>
                        <span class="rate-value" id="rate-bcv">--.--</span>
                    </div>
                    <div onclick="setSource('binance')" id="card-binance" class="rate-card flex-1">
                        <span class="rate-label">Binance</span>
                        <span class="rate-value" id="rate-binance">--.--</span>
                    </div>
                    <div onclick="setSource('custom')" id="card-custom" class="rate-card flex-1">
                        <span class="rate-label">Propia</span>
                        <span class="rate-value" id="rate-propia">--.--</span>
                    </div>
                </div>

                <div id="custom-rate-row" class="hidden shrink-0 mt-2">
                    <div class="flex items-center gap-2 glass rounded-xl px-3 py-1.5">
                        <span class="text-[9px] font-bold text-purple-300/50 uppercase tracking-wider">Tu tasa:</span>
                        <input type="text" id="input-custom-rate" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false"
                            class="flex-1 bg-transparent text-sm font-bold text-purple-100 outline-none cursor-default"
                            placeholder="0.00">
                        <span class="text-[8px] text-purple-400/40 font-bold">Bs/USD</span>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center px-0 min-h-0" style="gap:var(--input-gap)">
                    <div>
                        <label class="uppercase text-purple-300/50 font-bold ml-1 mb-1 block input-label">Dólares (USD)</label>
                        <div id="wrap-usd" class="input-box input-selected" onclick="focusInput('usd')">
                            <span class="input-currency">$</span>
                            <input type="text" id="input-usd" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" class="input-inner" placeholder="0.00">
                        </div>
                    </div>

                    <div>
                        <label class="uppercase text-purple-300/50 font-bold ml-1 mb-1 block input-label">Bolívares (VES)</label>
                        <div id="wrap-ves" class="input-box" onclick="focusInput('ves')">
                            <span class="input-currency">Bs</span>
                            <input type="text" id="input-ves" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" class="input-inner" placeholder="0.00">
                        </div>
                    </div>
                </div>
            </div> <!-- fin page-inicio -->

            <div id="page-compra" class="hidden flex-1 flex flex-col min-h-0 overflow-y-auto px-1" style="padding-bottom:var(--top-py)">
                <div class="flex flex-col gap-2 h-full">
                    <div class="glass rounded-xl px-3 py-2">
                        <label class="text-[9px] uppercase tracking-[0.2em] text-purple-300/40 font-bold">Saldo Disponible</label>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-purple-400/60 font-bold text-sm">Bs</span>
                            <input type="text" id="compra-saldo" inputmode="decimal" autocomplete="off" class="flex-1 bg-transparent border-b border-purple-500/30 text-xl font-bold text-purple-100 outline-none py-1.5" placeholder="0.00">
                        </div>
                    </div>

                    <div id="compra-lista" class="flex-1 overflow-y-auto flex flex-col gap-1 min-h-0">
                        <div class="text-center text-purple-400/30 text-[10px] font-bold uppercase tracking-wider py-4">Sin items</div>
                    </div>
                </div>
            </div>

            <div id="compra-form" class="hidden shrink-0 px-3 pb-1 z-10" style="background:linear-gradient(to top, rgba(15,12,29,1) 60%, transparent)">
                <div class="glass rounded-xl px-3 py-3">
                    <div class="flex items-center gap-2 mb-2">
                        <div id="compra-moneda" class="flex rounded-md border border-purple-500/20 overflow-hidden">
                            <span class="px-2.5 py-0.5 text-xs font-bold cursor-pointer text-purple-400/50" data-m="Bs" onclick="toggleMoneda(this)">Bs</span>
                            <span class="px-2.5 py-0.5 text-xs font-bold cursor-pointer bg-purple-500/20 text-purple-100" data-m="$" onclick="toggleMoneda(this)">$</span>
                        </div>
                        <span class="text-[9px] uppercase tracking-[0.2em] text-purple-300/40 font-bold ml-auto">Precio</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="text" id="compra-precio" inputmode="decimal" enterkeyhint="done" autocomplete="off" class="flex-1 min-w-0 bg-transparent border-b border-purple-500/30 text-lg font-bold text-purple-100 outline-none py-1.5" placeholder="0.00">
                        <div class="flex items-center gap-0.5 shrink-0">
                            <button class="flex items-center justify-center w-10 h-10 rounded-md bg-purple-500/10 border border-purple-500/20 text-purple-300 font-bold text-lg" ontouchstart="compraCant(-1);event.preventDefault()" onmousedown="compraCant(-1);event.preventDefault()">−</button>
                            <span id="compra-cant" class="text-purple-100 font-bold text-lg w-7 text-center">1</span>
                            <button class="flex items-center justify-center w-10 h-10 rounded-md bg-purple-500/10 border border-purple-500/20 text-purple-300 font-bold text-lg" ontouchstart="compraCant(1);event.preventDefault()" onmousedown="compraCant(1);event.preventDefault()">+</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 mt-1 min-h-5" id="compra-rate-row">
                        <span class="text-[8px] uppercase tracking-[0.2em] text-purple-400/30 font-bold">Tasa</span>
                        <span class="text-[10px] font-bold cursor-pointer rounded px-1.5 py-0.5 text-purple-300 bg-purple-500/20" onclick="selectCompraRate('bcv')" id="compra-rate-bcv">BCV</span>
                        <span class="text-[10px] font-bold cursor-pointer rounded px-1.5 py-0.5 text-purple-400/40" onclick="selectCompraRate('binance')" id="compra-rate-binance">Binance</span>
                        <span id="compra-conv" class="text-[9px] text-purple-400/40 font-bold ml-auto"></span>
                    </div>
                    <input type="text" id="compra-concepto" inputmode="text" enterkeyhint="go" autocomplete="off" class="w-full bg-transparent border-b border-purple-500/30 text-sm text-purple-200 outline-none py-1.5 mt-2" placeholder="Concepto...">
                    <button onclick="compraAgregar()" id="compra-btn" class="w-full mt-2 py-2.5 bg-purple-500/30 text-purple-100 rounded-xl border border-purple-500/40 font-bold text-sm">+ Agregar</button>
                </div>
            </div>

            <div id="page-calendario" class="hidden flex-1 flex flex-col min-h-0 overflow-y-auto" style="padding-bottom:var(--top-py)">
                <div class="px-4 pt-2">
                    <div class="glass rounded-xl px-4 py-3">
                        <div class="flex items-center justify-between">
                            <button onclick="calNav(-1)" class="flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500/10 border border-purple-500/20 text-purple-300 font-bold text-lg">‹</button>
                            <span id="cal-titulo" class="text-purple-100 font-bold text-sm"></span>
                            <button onclick="calNav(1)" class="flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500/10 border border-purple-500/20 text-purple-300 font-bold text-lg">›</button>
                        </div>
                        <div class="grid grid-cols-7 gap-0 mt-3">
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">L</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">M</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">M</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">J</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">V</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">S</span>
                            <span class="text-center text-[9px] font-bold text-purple-400/40 uppercase py-1">D</span>
                        </div>
                        <div id="cal-grid" class="grid grid-cols-7 gap-0 mt-1"></div>
                    </div>
                </div>
            </div>

            <div id="keypad" class="shrink-0 grid grid-cols-4 gap-1.5" style="height:var(--keypad-h);grid-template-rows:repeat(4,1fr);">
                <button class="keypad-btn" data-key="7">7</button>
                <button class="keypad-btn" data-key="8">8</button>
                <button class="keypad-btn" data-key="9">9</button>
                <button class="keypad-btn keypad-btn-op" data-key="backspace"><i data-lucide="delete" class="w-4 h-4"></i></button>
                <button class="keypad-btn" data-key="4">4</button>
                <button class="keypad-btn" data-key="5">5</button>
                <button class="keypad-btn" data-key="6">6</button>
                <button class="keypad-btn keypad-btn-op" data-key="+">+</button>
                <button class="keypad-btn" data-key="1">1</button>
                <button class="keypad-btn" data-key="2">2</button>
                <button class="keypad-btn" data-key="3">3</button>
                <button class="keypad-btn keypad-btn-op" data-key="clear">C</button>
                <button class="keypad-btn" data-key=".">.</button>
                <button class="keypad-btn" data-key="0">0</button>
                <button class="keypad-btn keypad-btn-op" data-key="clear-all">AC</button>
                <button class="keypad-btn keypad-btn-op" data-key="swap">⇄</button>
            </div>

            <div id="bottom-nav" class="shrink-0 flex items-center justify-around px-2 pt-3 pb-1 border-t border-purple-500/10" style="background:rgba(20,12,40,0.6)">
                <div class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-purple-400 nav-active" data-page="inicio" onclick="showPage('inicio')">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold uppercase tracking-wider">Inicio</span>
                </div>
                <div class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-purple-400/50" data-page="compra" onclick="showPage('compra')">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold uppercase tracking-wider">Compra</span>
                </div>
                <div class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-purple-400/50" data-page="calendario">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold uppercase tracking-wider">Calendario</span>
                </div>
                <div class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-purple-400/50" data-page="config">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold uppercase tracking-wider">Config</span>
                </div>
            </div>

            <button id="install-btn" class="hidden fixed top-2 left-1/2 -translate-x-1/2 px-4 py-1 bg-purple-500 text-purple-950 text-[9px] font-black rounded-full shadow-lg shadow-purple-500/30 z-50">
                INSTALAR APP
            </button>

        </div>
    </div>

    <script>
        let rates = { bcv: 0, binance: 0, custom: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';
        let activeInput = 'usd';
        let deferredPrompt;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateBinanceEl = document.getElementById('rate-binance');
        const ratePropiaEl = document.getElementById('rate-propia');
        const lastDateEl = document.getElementById('last-date');
        const lastTimeEl = document.getElementById('last-time');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const inputCustomRate = document.getElementById('input-custom-rate');
        const customRateRow = document.getElementById('custom-rate-row');

        const cardBcv = document.getElementById('card-bcv');
        const cardBinance = document.getElementById('card-binance');
        const cardCustom = document.getElementById('card-custom');
        const installBtn = document.getElementById('install-btn');

        lucide.createIcons();

        function focusInput(name) {
            activeInput = name;
            lastEdited = name;
            document.querySelectorAll('.input-box').forEach(el => el.classList.remove('input-selected'));
            if (name === 'usd') inputUsd.parentElement.classList.add('input-selected');
            else if (name === 'ves') inputVes.parentElement.classList.add('input-selected');
            else if (name === 'custom') inputCustomRate.parentElement.classList.add('input-selected');
        }

        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!document.getElementById('page-compra').classList.contains('hidden')) return;
                const key = btn.dataset.key;
                const el = activeInput === 'custom' ? inputCustomRate
                          : activeInput === 'ves' ? inputVes : inputUsd;
                const pos = el.selectionStart ?? el.value.length;

                if (key === 'backspace') {
                    if (pos > 0) {
                        el.value = el.value.slice(0, pos - 1) + el.value.slice(pos);
                        el.setSelectionRange(pos - 1, pos - 1);
                    }
                } else if (key === 'clear') {
                    el.value = '';
                } else if (key === 'clear-all') {
                    inputUsd.value = '';
                    inputVes.value = '';
                    inputCustomRate.value = '';
                    if (currentSource !== 'bcv') setSource('bcv');
                    focusInput('usd');
                    return;
                } else if (key === 'swap') {
                    if (activeInput === 'usd') { focusInput('ves'); lastEdited = 'ves'; triggerCalc(); }
                    else if (activeInput === 'ves') { focusInput('usd'); lastEdited = 'usd'; triggerCalc(); }
                    return;
                } else if (key === '+') {
                    el.value = el.value + '+';
                    el.setSelectionRange(el.value.length, el.value.length);
                } else {
                    el.value = el.value.slice(0, pos) + key + el.value.slice(pos);
                    el.setSelectionRange(pos + 1, pos + 1);
                }

                focusInput(activeInput === 'custom' ? 'custom' : activeInput);
                scrollInputEnd(inputUsd);
                scrollInputEnd(inputVes);
                scrollInputEnd(inputCustomRate);
                if (activeInput === 'custom') calculate(lastEdited);
                else triggerCalc();
            });
        });

        function triggerCalc() {
            calculate(lastEdited);
            focusInput(lastEdited);
            autoSize(inputUsd, '--input-fs');
            autoSize(inputVes, '--input-fs');
            scrollInputEnd(inputUsd);
            scrollInputEnd(inputVes);
        }

        function manualRefresh() {
            location.reload();
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        async function fetchRates() {
            let loadedFromCache = false;

            const loadCached = () => {
                const cached = localStorage.getItem('tasas');
                if (cached) {
                    const { bcv, binance, ts } = JSON.parse(cached);
                    rates.bcv = bcv;
                    rates.binance = binance;
                    const d = new Date(ts);
                    lastDateEl.textContent = d.toLocaleDateString('es-VE', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' });
                    lastTimeEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span> Sin conexión';
                    return true;
                }
                return false;
            };

            try {
                const response = await fetch('/rates.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data.USD) rates.bcv = data.USD;
                    updateUI(data);
                    localStorage.setItem('tasas', JSON.stringify({ bcv: rates.bcv, binance: rates.binance, ts: Date.now() }));
                } else {
                    if (!loadCached()) throw new Error();
                }
            } catch (_) {
                if (!loadCached()) {
                    loadingEl.classList.add('hidden');
                    contentEl.classList.remove('hidden');
                }
            }

            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (res.ok) {
                    const list = await res.json();
                    const p2p = list.find(item => item.fuente === 'paralelo');
                    if (p2p) rates.binance = p2p.promedio || p2p.venta;
                    localStorage.setItem('tasas', JSON.stringify({ bcv: rates.bcv, binance: rates.binance, ts: Date.now() }));
                }
            } catch (_) {}

            updateUI(null);
        }

        function updateUI(data) {
            rateBcvEl.textContent = rates.bcv > 0 ? rates.bcv.toFixed(2) : '--.--';
            rateBinanceEl.textContent = rates.binance > 0 ? rates.binance.toFixed(2) : '--.--';
            ratePropiaEl.textContent = rates.custom > 0 ? rates.custom.toFixed(2) : '--.--';
            autoSizeRate(rateBcvEl, '--rate-value');
            autoSizeRate(rateBinanceEl, '--rate-value');
            autoSizeRate(ratePropiaEl, '--rate-value');
            if (data && data.effective_date) {
                lastDateEl.textContent = data.effective_date;
                lastTimeEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Vigente';
            }
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
            focusInput('usd');
        }

        function selectCard(card) {
            [cardBcv, cardBinance, cardCustom].forEach(c => c.classList.remove('rate-card-selected'));
            if (card) card.classList.add('rate-card-selected');
        }

        function setSource(source) {
            currentSource = source;
            customRateRow.classList.add('hidden');

            if (source === 'bcv') {
                selectCard(cardBcv);
            } else if (source === 'binance') {
                selectCard(cardBinance);
            } else if (source === 'custom') {
                selectCard(cardCustom);
                customRateRow.classList.remove('hidden');
                focusInput('custom');
            }

            if (source === 'custom') focusInput('custom');
            else focusInput(lastEdited);
            calculate(source === 'custom' ? 'custom' : lastEdited);
        }

        function autoSize(el, varName) {
            const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            const base = raw.endsWith('rem') ? parseFloat(raw) * 16 : parseFloat(raw);
            const nums = el.value.replace(/[^0-9.]/g, '');
            const len = nums.length;
            let scale = 1;
            if (len > 14) scale = 0.65;
            else if (len > 11) scale = 0.8;
            else if (len > 9) scale = 0.9;
            el.style.fontSize = (base * scale) + 'px';
        }

        function autoSizeRate(el, varName) {
            const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            const base = raw.endsWith('rem') ? parseFloat(raw) * 16 : parseFloat(raw);
            const len = el.textContent.replace(/[^0-9.]/g, '').length;
            let scale = 1;
            if (len > 10) scale = 0.65;
            else if (len > 8) scale = 0.8;
            el.style.fontSize = (base * scale) + 'px';
        }

        function scrollInputEnd(el) {
            requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
        }

        document.querySelectorAll('.input-inner').forEach(el => {
            el.addEventListener('focus', () => {
                setTimeout(() => el.scrollLeft = el.scrollWidth, 50);
            });
            el.addEventListener('touchstart', (e) => {
                if (el.id === 'compra-saldo') return;
                e.preventDefault();
                const x = e.touches[0].clientX - el.getBoundingClientRect().left;
                const approx = Math.round(x / (el.scrollWidth / Math.max(el.value.length, 1)) * el.value.length);
                el.setSelectionRange(Math.min(approx, el.value.length), Math.min(approx, el.value.length));
            });
        });

        function parseSum(str) {
            if (!str || str.trim() === '') return NaN;
            let total = 0;
            for (const p of str.split('+')) {
                const t = p.trim();
                if (t === '') continue;
                const val = parseFloat(t);
                if (isNaN(val)) return NaN;
                total += val;
            }
            return total;
        }

        function calculate(triggerField) {
            let rate = currentSource === 'custom' ? parseFloat(inputCustomRate.value) : rates[currentSource];
            rates.custom = parseFloat(inputCustomRate.value) || 0;
            ratePropiaEl.textContent = rates.custom > 0 ? rates.custom.toFixed(2) : '--.--';
            autoSizeRate(ratePropiaEl, '--rate-value');

            if (!rate || isNaN(rate) || rate === 0) {
                if (triggerField === 'usd' || triggerField === 'custom') inputVes.value = '';
                else inputUsd.value = '';
                return;
            }

            if (triggerField === 'usd' || triggerField === 'custom') {
                const val = parseSum(inputUsd.value);
                inputVes.value = !isNaN(val) ? (val * rate).toFixed(2) : '';
                autoSize(inputVes, '--input-fs');
            } else {
                const val = parseSum(inputVes.value);
                inputUsd.value = !isNaN(val) ? (val / rate).toFixed(2) : '';
                autoSize(inputUsd, '--input-fs');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        let compraItems = [];
        let compraCantVal = 1;
        let compraEditIndex = null;
        let compraMoneda = '$';
        let compraRate = 'bcv';

        function showPage(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
            document.getElementById('page-inicio').classList.toggle('hidden', page !== 'inicio');
            document.getElementById('page-compra').classList.toggle('hidden', page !== 'compra');
            document.getElementById('compra-form').classList.toggle('hidden', page !== 'compra');
            document.getElementById('page-calendario').classList.toggle('hidden', page !== 'calendario');
            document.getElementById('keypad').classList.toggle('hidden', page !== 'inicio');
            const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
            if (navItem) navItem.classList.add('nav-active');
            if (page === 'calendario') renderCal();
            lucide.createIcons();
        }

        function toggleMoneda(el) {
            document.getElementById('compra-moneda').querySelectorAll('span').forEach(s => {
                s.classList.toggle('bg-purple-500/20', s === el);
                s.classList.toggle('text-purple-100', s === el);
                s.classList.toggle('text-purple-400/50', s !== el);
            });
            compraMoneda = el.dataset.m;
            compraConvPreview();
        }

        function selectCompraRate(src) {
            compraRate = src;
            document.querySelectorAll('#compra-rate-row span[id^="compra-rate-"]').forEach(s => {
                s.classList.toggle('bg-purple-500/20', s.id === 'compra-rate-' + src);
                s.classList.toggle('text-purple-300', s.id === 'compra-rate-' + src);
                s.classList.toggle('text-purple-400/40', s.id !== 'compra-rate-' + src);
            });
            compraConvPreview();
        }

        function compraConvPreview() {
            const el = document.getElementById('compra-conv');
            const precio = parseFloat(document.getElementById('compra-precio').value);
            if (compraMoneda === '$' && precio > 0) {
                const rateSrc = compraRate === 'bcv' ? rates.bcv : rates.binance;
                if (rateSrc > 0) {
                    const total = (precio * compraCantVal * rateSrc).toFixed(2);
                    el.textContent = '≈ ' + total + ' Bs';
                    return;
                }
            }
            el.textContent = '';
        }

        function compraCant(delta) {
            compraCantVal = Math.max(1, compraCantVal + delta);
            document.getElementById('compra-cant').textContent = compraCantVal;
            compraConvPreview();
        }

        function compraAgregar() {
            const saldoEl = document.getElementById('compra-saldo');
            const precioEl = document.getElementById('compra-precio');
            const conceptoEl = document.getElementById('compra-concepto');
            const moneda = compraMoneda;

            const precio = parseFloat(precioEl.value);
            if (isNaN(precio) || precio <= 0) return alert('Precio invalido');
            if (!conceptoEl.value.trim()) return alert('Escribe un concepto');

            if (compraEditIndex !== null) {
                const old = compraItems[compraEditIndex];
                const oldTotal = old.moneda === 'Bs' ? old.precio * old.cantidad : old.precio * old.cantidad * (old.rateVal || 0);
                if (oldTotal > 0) {
                    const saldo = parseFloat(saldoEl.value) || 0;
                    saldoEl.value = (saldo + oldTotal).toFixed(2);
                }
                compraItems[compraEditIndex] = { precio, moneda, cantidad: compraCantVal, concepto: conceptoEl.value.trim(), rateVal, rateSrc: compraRate };
                compraEditIndex = null;
                document.getElementById('compra-btn').textContent = '+ Agregar';
            } else {
                const rateVal = moneda === '$' ? (compraRate === 'bcv' ? rates.bcv : rates.binance) : 0;
                const item = { precio, moneda, cantidad: compraCantVal, concepto: conceptoEl.value.trim(), rateVal, rateSrc: compraRate };
                compraItems.push(item);
            }

            if (moneda === 'Bs') {
                const saldo = parseFloat(saldoEl.value) || 0;
                saldoEl.value = Math.max(0, saldo - precio * compraCantVal).toFixed(2);
            } else {
                const rateSrc = compraRate === 'bcv' ? rates.bcv : rates.binance;
                if (rateSrc > 0) {
                    const saldo = parseFloat(saldoEl.value) || 0;
                    saldoEl.value = Math.max(0, saldo - precio * compraCantVal * rateSrc).toFixed(2);
                }
            }

            precioEl.value = '';
            conceptoEl.value = '';
            compraCantVal = 1;
            document.getElementById('compra-cant').textContent = '1';
            renderCompraLista();
        }

        function renderCompraLista() {
            const lista = document.getElementById('compra-lista');
            if (compraItems.length === 0) {
                lista.innerHTML = '<div class="text-center text-purple-400/30 text-[10px] font-bold uppercase tracking-wider py-4">Sin items</div>';
                return;
            }

            const totalBs = compraItems.reduce((sum, item) => {
                if (item.moneda === 'Bs') return sum + item.precio * item.cantidad;
                return sum + item.precio * item.cantidad * (item.rateVal || 0);
            }, 0);
            const saldoRestante = parseFloat(document.getElementById('compra-saldo').value) || 0;
            const saldoInicial = (saldoRestante + totalBs).toFixed(2);

            let html = `
                <div class="flex items-center justify-between glass rounded-lg px-3 py-2 text-[10px] font-bold text-purple-300/60">
                    <span>Inicial: <span class="text-purple-100">${saldoInicial} Bs</span></span>
                    <span>Gastado: <span class="text-red-400/80">${totalBs.toFixed(2)} Bs</span></span>
                    <span>Restan: <span class="text-green-400/80">${saldoRestante.toFixed(2)} Bs</span></span>
                </div>`;

            html += compraItems.map((item, i) =>
                `<div class="flex items-center justify-between glass rounded-lg px-3 py-2">
                    <div class="flex flex-col min-w-0 flex-1">
                        <span class="text-purple-100 text-sm font-semibold truncate">${item.concepto}</span>
                        <span class="text-[10px] text-purple-400/50">${item.cantidad}x ${item.precio.toFixed(2)} ${item.moneda}</span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0 ml-2">
                        <button onclick="compraEditar(${i})" class="flex items-center justify-center w-7 h-7 rounded-md bg-purple-500/10 border border-purple-500/20 text-purple-300/60 text-xs"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                        <button onclick="compraEliminar(${i})" class="flex items-center justify-center w-7 h-7 rounded-md bg-red-500/10 border border-red-500/20 text-red-400/60 text-xs"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>`
            ).join('');
            lista.innerHTML = html;
            lucide.createIcons();
        }

        function compraEliminar(i) {
            if (!confirm('Eliminar este item?')) return;
            const item = compraItems[i];
            compraItems.splice(i, 1);
            const saldoEl = document.getElementById('compra-saldo');
            const total = item.moneda === 'Bs' ? item.precio * item.cantidad : item.precio * item.cantidad * (item.rateVal || 0);
            if (total > 0) {
                saldoEl.value = (parseFloat(saldoEl.value) + total).toFixed(2);
            }
            if (compraEditIndex === i) compraEditIndex = null;
            renderCompraLista();
        }

        function compraEditar(i) {
            const item = compraItems[i];
            document.getElementById('compra-precio').value = item.precio;
            document.getElementById('compra-concepto').value = item.concepto;
            document.getElementById('compra-moneda').querySelectorAll('span').forEach(s => {
                s.classList.toggle('bg-purple-500/20', s.dataset.m === item.moneda);
                s.classList.toggle('text-purple-100', s.dataset.m === item.moneda);
                s.classList.toggle('text-purple-400/50', s.dataset.m !== item.moneda);
            });
            compraMoneda = item.moneda;
            compraCantVal = item.cantidad;
            document.getElementById('compra-cant').textContent = item.cantidad;
            compraEditIndex = i;
            document.getElementById('compra-btn').textContent = '✓ Guardar';
            compraConvPreview();
        }

        document.getElementById('compra-precio').addEventListener('input', compraConvPreview);

        // Calendar
        let calDate = new Date();
        calDate.setDate(1);

        function renderCal() {
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            document.getElementById('cal-titulo').textContent = months[month] + ' ' + year;

            const firstDow = new Date(year, month, 1).getDay(); // 0=Sun
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);

            let html = '';
            let dow = firstDow === 0 ? 6 : firstDow - 1; // convert to Mon=0
            for (let i = 0; i < dow; i++) html += '<div></div>';

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                html += `<div class="text-center py-1.5 text-sm font-semibold rounded-lg ${isToday ? 'bg-purple-500/30 text-purple-100' : 'text-purple-300/60'}">${d}</div>`;
            }
            document.getElementById('cal-grid').innerHTML = html;
        }

        function calNav(delta) {
            calDate.setMonth(calDate.getMonth() + delta);
            renderCal();
        }

        // Enter key submits or advances in compra form
        document.getElementById('compra-precio').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.preventDefault();
        });
        document.getElementById('compra-precio').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                const concepto = document.getElementById('compra-concepto');
                if (concepto.value.trim()) compraAgregar();
                else concepto.focus();
            }
        });
        document.getElementById('compra-concepto').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.preventDefault();
        });
        document.getElementById('compra-concepto').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') compraAgregar();
        });

        // Float compra-form above keyboard
        function positionCompraForm(kh) {
            const form = document.getElementById('compra-form');
            const nav = document.getElementById('bottom-nav');
            if (!form || form.classList.contains('hidden')) { if (nav) nav.style.display = ''; return; }
            const app = document.getElementById('app');
            if (kh > 0) {
                const rect = app.getBoundingClientRect();
                form.style.position = 'fixed';
                form.style.bottom = kh + 'px';
                form.style.left = rect.left + 'px';
                form.style.width = rect.width + 'px';
                if (nav) nav.style.display = 'none';
            } else {
                form.style.position = 'static';
                form.style.bottom = 'auto';
                form.style.left = 'auto';
                form.style.width = 'auto';
                if (nav) nav.style.display = '';
            }
        }

        document.querySelectorAll('#compra-precio, #compra-concepto, #compra-saldo').forEach(el => {
            el.addEventListener('focus', () => {
                if (window.visualViewport) {
                    const kh = window.innerHeight - window.visualViewport.height;
                    if (kh <= 0) setTimeout(() => {
                        positionCompraForm(window.innerHeight - window.visualViewport.height);
                    }, 100);
                    else positionCompraForm(kh);
                }
            });
            el.addEventListener('blur', () => setTimeout(() => {
                if (window.visualViewport) {
                    positionCompraForm(window.innerHeight - window.visualViewport.height);
                }
            }, 200));
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                positionCompraForm(window.innerHeight - window.visualViewport.height);
            });
        }

        fetchRates();
    </script>

    <script>
        function togglePanel() {
            document.getElementById('layout-panel').classList.toggle('open');
            document.getElementById('layout-btn').classList.toggle('active');
        }

        function px(v) { return v + 'px'; }
        function rem(v) { return (v / 16).toFixed(3) + 'rem'; }

        const cssVars = [
            'rate-py', 'rate-px', 'rate-label-fs', 'rate-value-fs',
            'input-py', 'input-px', 'input-fs', 'label-fs', 'input-gap',
            'title-fs', 'header-mb', 'keypad-h', 'top-py'
        ];

        const sliderConfig = {
            'rate-py': { val: 4, fn: (v) => rem(v) },
            'rate-px': { val: 4, fn: (v) => rem(v) },
            'rate-label': { val: 16, fn: (v) => px(v) },
            'rate-value': { val: 25, fn: (v) => rem(v) },
            'input-py': { val: 19, fn: (v) => rem(v) },
            'input-px': { val: 17, fn: (v) => rem(v) },
            'input-fs': { val: 36, fn: (v) => rem(v) },
            'label-fs': { val: 13, fn: (v) => px(v) },
            'input-gap': { val: 13, fn: (v) => rem(v) },
            'title-fs': { val: 25, fn: (v) => rem(v) },
            'header-mb': { val: 15, fn: (v) => rem(v) },
            'keypad-h': { val: 38, fn: (v) => v + 'dvh' },
            'top-py': { val: 18, fn: (v) => rem(v) },
        };

        function updateFromSliders() {
            for (const [name, cfg] of Object.entries(sliderConfig)) {
                const el = document.getElementById('s-' + name);
                if (!el) continue;
                const raw = +el.value;
                const display = cfg.fn(raw);
                document.documentElement.style.setProperty('--' + name, display);
                const vEl = document.getElementById('v-' + name);
                if (vEl) vEl.textContent = display;
            }
            genOutput();
        }

        function genOutput() {
            const vars = {};
            for (const [name, cfg] of Object.entries(sliderConfig)) {
                const el = document.getElementById('s-' + name);
                if (el) vars[name] = cfg.fn(+el.value);
            }
            const code = `/* Rate Cards */\n`
                + `.rate-card { padding: ${vars['rate-py']} ${vars['rate-px']}; }\n`
                + `.rate-label { font-size: ${vars['rate-label']}; }\n`
                + `.rate-value { font-size: ${vars['rate-value']}; }\n\n`
                + `/* Inputs */\n`
                + `.input-box { padding: ${vars['input-py']} ${vars['input-px']}; font-size: ${vars['input-fs']}; }\n`
                + `.input-label { font-size: ${vars['label-fs']}; }\n`
                + `.inputs-inner { gap: ${vars['input-gap']}; }\n\n`
                + `/* Header */\n`
                + `header h1 { font-size: ${vars['title-fs']}; }\n`
                + `header { margin-bottom: ${vars['header-mb']}; }\n\n`
                + `/* Keypad */\n`
                + `#keypad { height: ${vars['keypad-h']}; }\n\n`
                + `/* Top section */\n`
                + `.top-section { padding: ${vars['top-py']} 0; }`;
            document.getElementById('lp-output').textContent = code;
        }

        document.querySelectorAll('#layout-panel input[type="range"]').forEach(el => {
            el.addEventListener('input', updateFromSliders);
        });

        function copyCSS() {
            const text = document.getElementById('lp-output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.lp-copy');
                btn.textContent = '✅ Copiado!';
                setTimeout(() => btn.textContent = '📋 Copiar CSS', 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                const btn = document.querySelector('.lp-copy');
                btn.textContent = '✅ Copiado!';
                setTimeout(() => btn.textContent = '📋 Copiar CSS', 2000);
            });
        }
    </script>
</body>
</html>
