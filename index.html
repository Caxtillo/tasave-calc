<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TasaVes - Tasas de Cambio Venezuela</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ico.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1d;
            color: #f3f0ff;
            overflow: hidden;
            height: 100dvh;
        }
        .glass {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .purple-glow {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        .input-focus:focus {
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.1);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        @media (max-height: 600px) {
            h1 { font-size: 1.5rem !important; }
            .rates-grid { gap: 0.5rem !important; }
            .main-card { padding: 1rem !important; gap: 0.5rem !important; }
            input { py: 3 !important; font-size: 1.5rem !important; }
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-[#0f0c1d] to-[#0f0c1d] flex items-center justify-center overflow-hidden">

    <div id="app" class="w-full max-w-md h-full flex flex-col p-4 sm:p-6">
        <!-- Loading State -->
        <div id="loading" class="flex-1 flex flex-col items-center justify-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="text-purple-300 animate-pulse font-medium">Consultando tasas actualizadas...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden flex-1 flex flex-col items-center justify-center space-y-6">
            <div class="glass rounded-3xl p-8 text-center space-y-4 w-full">
                <i data-lucide="alert-circle" class="mx-auto h-12 w-12 text-red-400"></i>
                <h2 class="text-xl font-semibold text-purple-100">Error de conexión</h2>
                <p class="text-purple-300/70">No pudimos obtener las tasas. Por favor, intenta de nuevo.</p>
                <button onclick="location.reload()" class="w-full py-3 bg-purple-500/20 hover:bg-purple-500/40 text-purple-200 rounded-xl transition-all border border-purple-500/30">Reintentar</button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="content" class="hidden flex-1 flex flex-col justify-between">
            <!-- Header -->
            <header class="text-center py-2 shrink-0 relative">
                <h1 class="text-3xl font-extrabold tracking-tight">Tasa<span class="purple-glow text-purple-400">Ves</span></h1>
                <p id="last-update" class="text-[9px] text-purple-300/40 flex items-center justify-center gap-1 uppercase tracking-widest mt-1">
                    <i data-lucide="refresh-cw" class="w-2.5 h-2.5"></i>
                    Sincronizando...
                </p>
                
                <!-- Install Button (Floating) -->
                <button id="install-btn" class="hidden absolute right-0 top-1/2 -translate-y-1/2 p-2 bg-purple-500/20 rounded-full border border-purple-500/30 text-purple-300">
                    <i data-lucide="download" class="w-4 h-4"></i>
                </button>
            </header>

            <!-- Rates Grid -->
            <div class="rates-grid grid grid-cols-2 gap-3 py-2 shrink-0">
                <div class="glass rounded-2xl p-3 flex flex-col items-center justify-center">
                    <span class="text-[9px] uppercase tracking-widest text-purple-300/50 font-bold mb-0.5">BCV Oficial</span>
                    <span class="text-xl font-bold text-white leading-tight" id="rate-bcv">--.--</span>
                    <span class="text-[8px] text-purple-400/60 font-medium uppercase">Bs. por USD</span>
                </div>
                <div class="glass rounded-2xl p-3 flex flex-col items-center justify-center">
                    <span class="text-[9px] uppercase tracking-widest text-purple-300/50 font-bold mb-0.5">Binance P2P</span>
                    <span class="text-xl font-bold text-white leading-tight" id="rate-binance">--.--</span>
                    <span class="text-[8px] text-purple-400/60 font-medium uppercase">Bs. por USDT</span>
                </div>
            </div>

            <!-- Calculator Card -->
            <div class="main-card glass rounded-3xl p-5 flex flex-col gap-4 shadow-[0_20px_50px_rgba(0,0,0,0.3)] mb-2">
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="btn-bcv" onclick="setSource('bcv')" class="flex-1 py-2 text-[10px] font-black rounded-lg transition-all bg-purple-400 text-purple-950">
                        TASA BCV
                    </button>
                    <button id="btn-binance" onclick="setSource('binance')" class="flex-1 py-2 text-[10px] font-black rounded-lg transition-all text-purple-300">
                        BINANCE P2P
                    </button>
                </div>

                <div class="flex-1 flex flex-col justify-center space-y-4 py-2">
                    <div class="relative w-full">
                        <label class="text-[9px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 mb-1.5 block font-bold">Dólares (USD/USDT)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-purple-400 font-bold text-lg">$</span>
                            <input type="number" id="input-usd" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-2xl py-4 pl-10 pr-4 text-2xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/30">
                        </div>
                    </div>

                    <div class="flex justify-center -my-4 relative z-10">
                        <div class="bg-purple-950/80 p-1.5 rounded-full border border-purple-500/30 backdrop-blur-sm">
                            <i data-lucide="arrow-down-up" class="w-3.5 h-3.5 text-purple-300"></i>
                        </div>
                    </div>

                    <div class="relative w-full">
                        <label class="text-[9px] uppercase tracking-[0.2em] text-purple-300/50 ml-1 mb-1.5 block font-bold">Bolívares (VES)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-purple-400 font-bold text-xs">Bs</span>
                            <input type="number" id="input-ves" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-2xl py-4 pl-12 pr-4 text-2xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/30">
                        </div>
                    </div>
                </div>

                <div class="pt-2 border-t border-purple-500/10">
                    <p class="text-[8px] text-center text-purple-400/40 font-bold uppercase tracking-[0.2em]">
                        Calculadora con <span id="current-label" class="text-purple-300">Tasa BCV</span>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center py-2 shrink-0">
                <p class="text-[8px] uppercase tracking-[0.4em] opacity-20 font-bold">TasaVes &bull; 2026</p>
            </footer>
        </div>
    </div>

    <script>
        let rates = { bcv: 0, binance: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';
        let deferredPrompt;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateBinanceEl = document.getElementById('rate-binance');
        const lastUpdateEl = document.getElementById('last-update');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const btnBcv = document.getElementById('btn-bcv');
        const btnBinance = document.getElementById('btn-binance');
        const currentLabel = document.getElementById('current-label');
        const installBtn = document.getElementById('install-btn');

        lucide.createIcons();

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        async function fetchRates() {
            try {
                // Using DolarApi.com (CORS friendly and high availability)
                const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                // Extraemos las tasas
                const bcvData = data.find(item => item.fuente === 'oficial');
                const paraleloData = data.find(item => item.fuente === 'paralelo');

                if (bcvData) rates.bcv = bcvData.promedio || bcvData.venta;
                if (paraleloData) rates.binance = paraleloData.promedio || paraleloData.venta;

                updateUI(bcvData?.fechaActualizacion || paraleloData?.fechaActualizacion);
            } catch (error) {
                console.error('Fetch error:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        function updateUI(dateString) {
            rateBcvEl.textContent = rates.bcv.toFixed(2);
            rateBinanceEl.textContent = rates.binance.toFixed(2);
            
            if (dateString) {
                const date = new Date(dateString);
                lastUpdateEl.innerHTML = `<i data-lucide="check-circle-2" class="w-2.5 h-2.5"></i> Actualizado: ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                lucide.createIcons();
            }

            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
        }

        function setSource(source) {
            currentSource = source;
            if (source === 'bcv') {
                btnBcv.className = 'flex-1 py-2 text-[10px] font-black rounded-lg transition-all bg-purple-400 text-purple-950';
                btnBinance.className = 'flex-1 py-2 text-[10px] font-black rounded-lg transition-all text-purple-300';
                currentLabel.textContent = 'Tasa BCV';
            } else {
                btnBinance.className = 'flex-1 py-2 text-[10px] font-black rounded-lg transition-all bg-purple-400 text-purple-950';
                btnBcv.className = 'flex-1 py-2 text-[10px] font-black rounded-lg transition-all text-purple-300';
                currentLabel.textContent = 'Binance P2P';
            }
            calculate(lastEdited);
        }

        function calculate(triggerField) {
            const rate = rates[currentSource];
            if (!rate || rate === 0) return;
            if (triggerField === 'usd') {
                const val = parseFloat(inputUsd.value);
                inputVes.value = !isNaN(val) ? (val * rate).toFixed(2) : '';
            } else {
                const val = parseFloat(inputVes.value);
                inputUsd.value = !isNaN(val) ? (val / rate).toFixed(2) : '';
            }
        }

        inputUsd.addEventListener('input', () => { lastEdited = 'usd'; calculate('usd'); });
        inputVes.addEventListener('input', () => { lastEdited = 'ves'; calculate('ves'); });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }

        fetchRates();
    </script>
</body>
</html>
