<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasaVes - Tasas de Cambio Venezuela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ededed;
        }
        .glass {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-green {
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .bg-neon-green {
            background-color: #22c55e;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center space-y-4 py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-500"></div>
            <p class="text-gray-400 animate-pulse">Cargando tasas actualizadas...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden glass rounded-3xl p-8 text-center space-y-4">
            <i data-lucide="alert-circle" class="mx-auto h-12 w-12 text-red-500"></i>
            <h2 class="text-xl font-semibold">Error al cargar datos</h2>
            <p class="text-gray-400">No pudimos obtener las tasas en este momento. Por favor, intenta de nuevo más tarde.</p>
            <button onclick="location.reload()" class="w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl transition-all">Reintentar</button>
        </div>

        <!-- Main Content -->
        <div id="content" class="hidden space-y-6">
            <!-- Header -->
            <div class="text-center space-y-1">
                <h1 class="text-3xl font-bold tracking-tight">Tasa<span class="neon-green">Ves</span></h1>
                <p id="last-update" class="text-xs text-gray-500 flex items-center justify-center gap-1">
                    <i data-lucide="clock" class="w-3 h-3"></i>
                    Actualizado en tiempo real
                </p>
            </div>

            <!-- Rates Cards -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center space-y-1 border-green-500/20">
                    <span class="text-[10px] uppercase tracking-widest text-gray-400 font-medium">BCV Oficial</span>
                    <div class="flex items-center gap-1">
                        <span class="text-xl font-bold" id="rate-bcv">--.--</span>
                        <span class="text-[10px] text-gray-500">VES</span>
                    </div>
                </div>
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center space-y-1 border-green-500/20">
                    <span class="text-[10px] uppercase tracking-widest text-gray-400 font-medium">Paralelo</span>
                    <div class="flex items-center gap-1">
                        <span class="text-xl font-bold" id="rate-paralelo">--.--</span>
                        <span class="text-[10px] text-gray-500">VES</span>
                    </div>
                </div>
            </div>

            <!-- Calculator Card -->
            <div class="glass rounded-3xl p-6 space-y-6 shadow-2xl">
                <!-- Source Selector -->
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="btn-bcv" onclick="setSource('bcv')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-neon-green text-black">
                        Tasa BCV
                    </button>
                    <button id="btn-paralelo" onclick="setSource('paralelo')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white">
                        Paralelo
                    </button>
                </div>

                <!-- Inputs -->
                <div class="space-y-4">
                    <div class="relative">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-1 mb-1 block font-semibold">Dólares (USD)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-gray-400 font-medium">$</span>
                            <input type="number" id="input-usd" placeholder="0.00" step="0.01"
                                class="w-full bg-black/30 border border-white/5 rounded-2xl py-4 pl-8 pr-4 text-2xl font-bold focus:outline-none focus:border-green-500/50 transition-all">
                        </div>
                    </div>

                    <div class="flex justify-center -my-2 relative z-10">
                        <div class="bg-neon-green p-2 rounded-full shadow-lg shadow-green-900/20">
                            <i data-lucide="arrow-down-up" class="w-4 h-4 text-black"></i>
                        </div>
                    </div>

                    <div class="relative">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-1 mb-1 block font-semibold">Bolívares (VES)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-gray-400 font-medium text-sm">Bs</span>
                            <input type="number" id="input-ves" placeholder="0.00" step="0.01"
                                class="w-full bg-black/30 border border-white/5 rounded-2xl py-4 pl-10 pr-4 text-2xl font-bold focus:outline-none focus:border-green-500/50 transition-all">
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <p class="text-[10px] text-center text-gray-500">
                        Los cálculos se basan en la tasa <span id="current-label">BCV</span>.
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center text-[10px] text-gray-600 uppercase tracking-[0.2em] pt-4">
                &copy; 2026 TasaVes &bull; Vercel Deployment
            </footer>
        </div>
    </div>

    <script>
        // State
        let rates = { bcv: 0, paralelo: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';

        // Elements
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateParaleloEl = document.getElementById('rate-paralelo');
        const lastUpdateEl = document.getElementById('last-update');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const btnBcv = document.getElementById('btn-bcv');
        const btnParalelo = document.getElementById('btn-paralelo');
        const currentLabel = document.getElementById('current-label');

        // Initialize Lucide
        lucide.createIcons();

        // Fetch Data
        async function fetchRates() {
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();

                // Note: The API returns an array, sometimes directly, sometimes in a 'value' property 
                // depending on the fetch environment.
                const results = Array.isArray(data) ? data : data.value;

                const bcvData = results.find(item => item.fuente === 'oficial');
                const paraleloData = results.find(item => item.fuente === 'paralelo');

                if (bcvData) rates.bcv = bcvData.promedio || bcvData.venta;
                if (paraleloData) rates.paralelo = paraleloData.promedio || paraleloData.venta;

                updateUI(bcvData?.fechaActualizacion || paraleloData?.fechaActualizacion);
            } catch (error) {
                console.error('Fetch error:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        function updateUI(dateString) {
            rateBcvEl.textContent = rates.bcv.toFixed(2);
            rateParaleloEl.textContent = rates.paralelo.toFixed(2);
            
            if (dateString) {
                const date = new Date(dateString);
                lastUpdateEl.innerHTML = `<i data-lucide="clock" class="w-3 h-3"></i> Actualizado: ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                lucide.createIcons();
            }

            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
        }

        function setSource(source) {
            currentSource = source;
            
            // Update UI buttons
            if (source === 'bcv') {
                btnBcv.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-neon-green text-black';
                btnParalelo.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white';
                currentLabel.textContent = 'BCV';
            } else {
                btnParalelo.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-neon-green text-black';
                btnBcv.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white';
                currentLabel.textContent = 'Paralelo';
            }

            // Recalculate based on last edited field
            calculate(lastEdited);
        }

        function calculate(triggerField) {
            const rate = rates[currentSource];
            if (!rate || rate === 0) return;

            if (triggerField === 'usd') {
                const val = parseFloat(inputUsd.value);
                if (!isNaN(val)) {
                    inputVes.value = (val * rate).toFixed(2);
                } else {
                    inputVes.value = '';
                }
            } else {
                const val = parseFloat(inputVes.value);
                if (!isNaN(val)) {
                    inputUsd.value = (val / rate).toFixed(2);
                } else {
                    inputUsd.value = '';
                }
            }
        }

        // Event Listeners
        inputUsd.addEventListener('input', () => {
            lastEdited = 'usd';
            calculate('usd');
        });

        inputVes.addEventListener('input', () => {
            lastEdited = 'ves';
            calculate('ves');
        });

        // Start
        fetchRates();
    </script>
</body>
</html>
