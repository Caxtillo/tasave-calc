<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasaVes - Tasas de Cambio Venezuela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1d; /* Fondo azul muy oscuro/morado */
            color: #f3f0ff;
        }
        .glass {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .purple-glow {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        .bg-purple-accent {
            background-color: #a78bfa;
        }
        .input-focus:focus {
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-[#0f0c1d] to-[#0f0c1d]">

    <div id="app" class="w-full max-w-md">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center space-y-4 py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="text-purple-300 animate-pulse">Consultando tasas...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden glass rounded-3xl p-8 text-center space-y-4">
            <i data-lucide="alert-circle" class="mx-auto h-12 w-12 text-red-400"></i>
            <h2 class="text-xl font-semibold text-purple-100">Error de conexión</h2>
            <p class="text-purple-300/70">No pudimos conectar con el servidor de tasas. Revisa tu internet.</p>
            <button onclick="location.reload()" class="w-full py-3 bg-purple-500/20 hover:bg-purple-500/40 text-purple-200 rounded-xl transition-all border border-purple-500/30">Reintentar</button>
        </div>

        <!-- Main Content -->
        <div id="content" class="hidden space-y-6">
            <!-- Header -->
            <div class="text-center space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tight">Tasa<span class="purple-glow text-purple-400">Ves</span></h1>
                <p id="last-update" class="text-[10px] text-purple-300/50 flex items-center justify-center gap-1 uppercase tracking-widest">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                    Sincronizado
                </p>
            </div>

            <!-- Rates Cards -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                    <span class="text-[10px] uppercase tracking-widest text-purple-300/60 font-semibold">BCV Oficial</span>
                    <div class="flex items-center gap-1">
                        <span class="text-2xl font-bold text-white" id="rate-bcv">--.--</span>
                    </div>
                    <span class="text-[9px] text-purple-400/80 font-medium">VES/USD</span>
                </div>
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                    <span class="text-[10px] uppercase tracking-widest text-purple-300/60 font-semibold">Paralelo</span>
                    <div class="flex items-center gap-1">
                        <span class="text-2xl font-bold text-white" id="rate-paralelo">--.--</span>
                    </div>
                    <span class="text-[9px] text-purple-400/80 font-medium">VES/USD</span>
                </div>
            </div>

            <!-- Calculator Card -->
            <div class="glass rounded-3xl p-6 space-y-6 shadow-[0_20px_50px_rgba(0,0,0,0.3)]">
                <!-- Source Selector -->
                <div class="flex bg-black/40 p-1.5 rounded-2xl">
                    <button id="btn-bcv" onclick="setSource('bcv')" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-purple-400 text-purple-950 shadow-lg shadow-purple-500/20">
                        USAR BCV
                    </button>
                    <button id="btn-paralelo" onclick="setSource('paralelo')" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-purple-300 hover:text-white">
                        PARALELO
                    </button>
                </div>

                <!-- Inputs -->
                <div class="space-y-4">
                    <div class="relative group">
                        <label class="text-[10px] uppercase tracking-[0.15em] text-purple-300/60 ml-1 mb-2 block font-bold">Dólares (USD)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-5 text-purple-400 font-bold">$</span>
                            <input type="number" id="input-usd" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-2xl py-5 pl-10 pr-5 text-3xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/50">
                        </div>
                    </div>

                    <div class="flex justify-center -my-3 relative z-10">
                        <div class="bg-purple-500/20 p-2.5 rounded-full border border-purple-500/30 backdrop-blur-sm">
                            <i data-lucide="repeat" class="w-4 h-4 text-purple-300"></i>
                        </div>
                    </div>

                    <div class="relative group">
                        <label class="text-[10px] uppercase tracking-[0.15em] text-purple-300/60 ml-1 mb-2 block font-bold">Bolívares (VES)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-5 text-purple-400 font-bold text-sm">Bs</span>
                            <input type="number" id="input-ves" placeholder="0.00" step="0.01"
                                class="w-full bg-black/40 border border-purple-500/10 rounded-2xl py-5 pl-12 pr-5 text-3xl font-bold text-white focus:outline-none input-focus transition-all placeholder:text-purple-900/50">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-purple-500/10">
                    <p class="text-[10px] text-center text-purple-400/50 font-medium uppercase tracking-widest">
                        Calculando con tasa <span id="current-label" class="text-purple-300">BCV</span>
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center space-y-2 opacity-40">
                <p class="text-[10px] uppercase tracking-[0.3em]">TasaVes v1.0</p>
            </footer>
        </div>
    </div>

    <script>
        // State
        let rates = { bcv: 0, paralelo: 0 };
        let currentSource = 'bcv';
        let lastEdited = 'usd';

        // Elements
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');
        const rateBcvEl = document.getElementById('rate-bcv');
        const rateParaleloEl = document.getElementById('rate-paralelo');
        const lastUpdateEl = document.getElementById('last-update');
        const inputUsd = document.getElementById('input-usd');
        const inputVes = document.getElementById('input-ves');
        const btnBcv = document.getElementById('btn-bcv');
        const btnParalelo = document.getElementById('btn-paralelo');
        const currentLabel = document.getElementById('current-label');

        lucide.createIcons();

        async function fetchRates() {
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const results = Array.isArray(data) ? data : data.value;

                const bcvData = results.find(item => item.fuente === 'oficial');
                const paraleloData = results.find(item => item.fuente === 'paralelo');

                if (bcvData) rates.bcv = bcvData.promedio || bcvData.venta;
                if (paraleloData) rates.paralelo = paraleloData.promedio || paraleloData.venta;

                updateUI(bcvData?.fechaActualizacion || paraleloData?.fechaActualizacion);
            } catch (error) {
                console.error('Error:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        function updateUI(dateString) {
            rateBcvEl.textContent = rates.bcv.toFixed(2);
            rateParaleloEl.textContent = rates.paralelo.toFixed(2);
            
            if (dateString) {
                const date = new Date(dateString);
                lastUpdateEl.innerHTML = `<i data-lucide="check-circle-2" class="w-3 h-3"></i> Datos al: ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                lucide.createIcons();
            }

            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
        }

        function setSource(source) {
            currentSource = source;
            
            if (source === 'bcv') {
                btnBcv.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-purple-400 text-purple-950 shadow-lg shadow-purple-500/20';
                btnParalelo.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-purple-300 hover:text-white';
                currentLabel.textContent = 'BCV';
            } else {
                btnParalelo.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-purple-400 text-purple-950 shadow-lg shadow-purple-500/20';
                btnBcv.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-purple-300 hover:text-white';
                currentLabel.textContent = 'Paralelo';
            }

            calculate(lastEdited);
        }

        function calculate(triggerField) {
            const rate = rates[currentSource];
            if (!rate || rate === 0) return;

            if (triggerField === 'usd') {
                const val = parseFloat(inputUsd.value);
                if (!isNaN(val)) {
                    inputVes.value = (val * rate).toFixed(2);
                } else {
                    inputVes.value = '';
                }
            } else {
                const val = parseFloat(inputVes.value);
                if (!isNaN(val)) {
                    inputUsd.value = (val / rate).toFixed(2);
                } else {
                    inputUsd.value = '';
                }
            }
        }

        inputUsd.addEventListener('input', () => {
            lastEdited = 'usd';
            calculate('usd');
        });

        inputVes.addEventListener('input', () => {
            lastEdited = 'ves';
            calculate('ves');
        });

        fetchRates();
    </script>
</body>
</html>
